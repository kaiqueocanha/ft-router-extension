name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool rules.json > /dev/null
      - name: Check JS syntax
        run: |
          node --check background.js
          node --check popup.js
